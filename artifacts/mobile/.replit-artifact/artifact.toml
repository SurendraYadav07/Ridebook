kind = "mobile"
previewPath = "/"
title = "RideGo"
description = "A ride-sharing app like Uber/Ola that lets users book instant rides or schedule rides in advance. Supports real-time driver tracking, multiple ride types, ride history, and profile management. Built for both Android and iOS."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/"
